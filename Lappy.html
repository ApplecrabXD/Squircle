<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lappy 13 Pro</title>
<link rel="icon" type="image/x-icon" href="Assets/Logos/Logo.svg">
<link rel="stylesheet" href="https://use.typekit.net/orz4bhr.css">
<link rel="stylesheet" href="Style.css">
<link rel="stylesheet" href="Lappy.css">
</head>

<body>

<div id="splash">
  <div class="splash-center">
    <div class="building-blocks">
      <img
        class="block-orange"
        src="Assets/Logos/Bulding%20Blocks/Orange.svg"
        alt="Ornage block"
      >
      <img
        class="block-gray"
        src="Assets/Logos/Bulding%20Blocks/Gray.svg"
        alt="Gray Block"
      >
      <img
        class="block-purple"
        src="Assets/Logos/Bulding%20Blocks/Purple.svg"
        alt="Purple Block"
      >
      <img
        class="block-white"
        src="Assets/Logos/Bulding%20Blocks/White.svg"
        alt="White Block"
      >
    </div>
    <div class="loading-container">
      <div class="loading-bar"></div>
    </div>

  </div>
</div>

<canvas id="canvas"></canvas>
<div class="grain" aria-hidden="true"></div>

<nav class="navbar">

  <div class="nav-orb">
    <a href="/" class="nav-logo">
      <img src="Assets/Logos/Logo.svg" alt="Squircle">

      <div class="nav-building-blocks">
        <img class="block-orange" src="Assets/Logos/Bulding%20Blocks/Orange.svg" alt="orange block">
        <img class="block-gray" src="Assets/Logos/Bulding%20Blocks/Gray.svg" alt="gray block">
        <img class="block-purple" src="Assets/Logos/Bulding%20Blocks/Purple.svg" alt="purple block">
        <img class="block-white" src="Assets/Logos/Bulding%20Blocks/White.svg" alt="white block">
      </div>
    </a>
  </div>

  <div class="nav-orb">
    <div class="nav-links">
      <div class="nav-indicator"></div>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="support.html">Support</a>
      <a href="about.html">About Us</a>
    </div>
  </div>

  <div class="nav-orb">
    <button class="nav-menu" aria-label="Open menu"><span>☰</span></button>
  </div>

</nav>

<section class="lappy-hero">
  <div class="lappy-hero-copy">
    <h1 class="lappy-hero-title">Hello Lappy<br>
      <span class="hero-title-atom">
        <span class="hero-title-atom-text">13 Pro</span>
        <canvas class="hero-title-atom-canvas" aria-hidden="true"></canvas>
      </span>
    </h1>
  </div>

  <div class="lappy-hero-laptop">
    <img src="Assets/Lappy/Logo in laptop.png" alt="Lappy 13 Pro laptop with the Squircle logo on screen">
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="Script.js"></script>

</body>
</html>
