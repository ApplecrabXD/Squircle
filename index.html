<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squircle</title>
<link rel="icon" type="image/x-icon" href="Assets/Logos/Logo.svg">
<link rel="stylesheet" href="https://use.typekit.net/orz4bhr.css">
<link rel="stylesheet" href="Style.css">

</head>

<body>

<!--splash screen-->
<div id="splash">

  <div class="building-blocks">

    <img
      class="block-orange"
      src="Assets/Logos/Bulding%20Blocks/Orange.svg"
      alt=""
    >

    <img
      class="block-gray"
      src="Assets/Logos/Bulding%20Blocks/Gray.svg"
      alt=""
    >

    <img
      class="block-purple"
      src="Assets/Logos/Bulding%20Blocks/Purple.svg"
      alt=""
    >

    <img
      class="block-white"
      src="Assets/Logos/Bulding%20Blocks/White.svg"
      alt=""
    >

    <div class="loading-container">
      <div class="loading-bar"></div>
    </div>

  </div>

</div>

<canvas id="canvas"></canvas>

<!--title screen-->
<div class="title">
  <h1>Welcome To</h1>
  <h1>Squircle</h1>
</div>

<script src="Script.js"></script>

</body>
</html>
