<body>

<div id="splash">

  <div class="building-blocks">

    <img

    <img
      class="block-gray"
      src="Assets/Logos/Bulding%20Blocks/Gray.svg"
      alt=""
    >

    <img
      class="block-purple"
      src="Assets/Logos/Bulding%20Blocks/Purple.svg"
      alt=""

    <img
      class="block-white"
      src="Assets/Logos/Bulding%20Blocks/White.svg"
      alt=""

      <div class="loading-bar"></div>
    </div>

  </div>

<!-- nav -->
<nav class="navbar">

      <img
        class="block-orange"
        src="Assets/Logos/Bulding%20Blocks/Orange.svg"
        alt=""
      >

      <img
        class="block-gray"
        src="Assets/Logos/Bulding%20Blocks/Gray.svg"
        alt=""
      >

      <img
        class="block-purple"
        src="Assets/Logos/Bulding%20Blocks/Purple.svg"
        alt=""
      >

      <img
        class="block-white"
        src="Assets/Logos/Bulding%20Blocks/White.svg"
        alt=""
      >

    </div>

    <span>Squircle</span>

  </a>


  <!-- middel -->
  <div class="nav-links">

    <a href="#work">Work</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>

  </div>


  <!-- right -->
  <button
    class="nav-menu"
    aria-label="Open menu"
  >
    ☰

</nav>
